# Storage crates meant to be shared between projects. Each crate stands alone
# and inherits nothing from this workspace, so a project can depend on either
# one by git tag.
[workspace]
resolver = "2"
members = ["crates/deniable", "crates/vault"]

# Debug info: file and line numbers for our code, none for dependencies,
# or the build folder grows by tens of gigabytes.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
